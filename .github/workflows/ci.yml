name: CI

# Minimal validation for pull requests. Scoped to apps/svegip today — extend
# the matrix/working-directory here once platform-services/ exists, rather
# than adding a second workflow file.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  validate-svegip:
    name: Validate apps/svegip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/svegip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/svegip/package-lock.json

      # Reproducible install from the committed lockfile — no floating versions.
      - name: Install dependencies
        run: npm ci

      # Plain JavaScript entry points: fail the build on any syntax error.
      - name: Syntax-check plain JS files
        run: |
          node --check app.js
          node --check create-user.mjs

      # netlify/functions and netlify/edge-functions are TypeScript (.mts) run
      # directly by the Netlify runtime — there is no build step to type-check
      # them against. esbuild's transform mode gives a real syntax check
      # without requiring @netlify/* type stubs or a live database/session
      # secret, so this step needs no production secrets.
      - name: Syntax-check Netlify Functions (.mts)
        run: |
          set -e
          for f in netlify/functions/*.mts netlify/edge-functions/*.mts; do
            echo "checking $f"
            npx --yes esbuild@0.28.2 --loader=ts < "$f" > /dev/null
          done

  validate-platform-contracts:
    name: Validate packages/ contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # packages/* are interface-only .ts contracts with no build tooling
      # wired up yet (see docs/architecture/platform-architecture.md
      # "Deferred tooling") — a syntax-only pass, same technique as
      # validate-svegip's .mts check, catches real breakage without
      # requiring a tsconfig/workspace setup that nothing consumes yet.
      - name: Syntax-check packages/ TypeScript contracts
        run: |
          set -e
          for f in $(find packages -name '*.ts'); do
            echo "checking $f"
            npx --yes esbuild@0.28.2 --loader=ts < "$f" > /dev/null
          done

  validate-identity:
    name: Validate platform-services/identity
    runs-on: ubuntu-latest
    # A real Postgres so the integration suite (session/RBAC/MFA/audit
    # repositories, and a full HTTP login flow) runs against the actual
    # schema, not only the in-memory fakes the unit suite also exercises.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sve_identity
          POSTGRES_PASSWORD: sve_identity_ci_only
          POSTGRES_DB: sve_identity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sve_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: platform-services/identity
    env:
      DATABASE_URL: postgresql://sve_identity:sve_identity_ci_only@localhost:5432/sve_identity_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform-services/identity/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run migrations against the CI database
        run: npm run migrate

      # Real unit + integration tests (not syntax checks) — password
      # hashing, RFC 4226/6238 TOTP vectors, session lifecycle, RBAC
      # cross-entity/admin-segregation scenarios, recovery codes, rate
      # limiting, audit redaction, and a full HTTP login flow — run with
      # --test-concurrency=1 so the integration suite's shared test
      # database isn't raced by multiple files truncating it at once.
      - name: Run tests
        run: npm test

  validate-data-vault:
    name: Validate platform-services/data-vault
    runs-on: ubuntu-latest
    # Same shared Postgres schema as Identity (Data Vault's own tables live
    # alongside Identity's, applied by the same migration runner) — see
    # docs/architecture/data-vault-foundation.md "Module ownership and
    # dependency direction".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sve_identity
          POSTGRES_PASSWORD: sve_identity_ci_only
          POSTGRES_DB: sve_identity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sve_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sve_identity:sve_identity_ci_only@localhost:5432/sve_identity_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            platform-services/identity/package-lock.json
            platform-services/data-vault/package-lock.json

      # Data Vault imports platform-services/identity's Postgres
      # repositories, session/RBAC/audit services, and migration runner by
      # source path (see src/composition/container.ts) rather than through
      # a published package — Node resolves each imported file's own
      # dependencies (e.g. `pg`) relative to that file's location, so
      # Identity's own node_modules must be installed here too, not just
      # Data Vault's. This is a documented consequence of the current
      # cross-package-import boundary, not an oversight — see
      # platform-services/data-vault/README.md.
      - name: Install platform-services/identity dependencies (Data Vault imports its Postgres/session/RBAC/audit implementations)
        working-directory: platform-services/identity
        run: npm ci

      - name: Install platform-services/data-vault dependencies
        working-directory: platform-services/data-vault
        run: npm ci

      - name: Type-check
        working-directory: platform-services/data-vault
        run: npm run typecheck

      - name: Run migrations against the CI database
        working-directory: platform-services/data-vault
        run: npm run migrate

      # Real unit + integration tests — RBAC/entity/classification
      # enforcement, the SVEGIP session-cookie bridge, CSRF/origin
      # protection for cookie-authenticated writes, mass-assignment and
      # IDOR/existence-leak checks, and versioning/archive behaviour —
      # against the real shared Postgres schema.
      - name: Run tests
        working-directory: platform-services/data-vault
        run: npm test

  validate-organisation:
    name: Validate platform-services/organisation
    runs-on: ubuntu-latest
    # Same shared Postgres schema as Identity and Data Vault (this package's
    # tables — business_units/departments/positions/employees/employment_
    # assignments — are applied by the same migration runner) — see
    # docs/architecture/organisation-employee-master.md "Module ownership
    # and dependency direction".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sve_identity
          POSTGRES_PASSWORD: sve_identity_ci_only
          POSTGRES_DB: sve_identity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sve_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sve_identity:sve_identity_ci_only@localhost:5432/sve_identity_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            platform-services/identity/package-lock.json
            platform-services/organisation/package-lock.json

      # Organisation imports platform-services/identity's Postgres
      # repositories, session/RBAC/audit services, and migration runner by
      # source path (see src/composition/container.ts) rather than through
      # a published package — same documented cross-package-import boundary
      # as Data Vault (see platform-services/organisation/README.md).
      - name: Install platform-services/identity dependencies (Organisation imports its Postgres/session/RBAC/audit implementations)
        working-directory: platform-services/identity
        run: npm ci

      - name: Install platform-services/organisation dependencies
        working-directory: platform-services/organisation
        run: npm ci

      - name: Type-check
        working-directory: platform-services/organisation
        run: npm run typecheck

      - name: Run migrations against the CI database
        working-directory: platform-services/organisation
        run: npm run migrate

      # Real unit + integration tests — organisation structure, Employee
      # Master CRUD, effective-dated assignment transitions/history,
      # reporting-cycle prevention, RBAC/entity/classification enforcement
      # (including SK Lai & Partners' privileged tier), Identity linkage,
      # mass-assignment and IDOR/existence-leak checks — against the real
      # shared Postgres schema.
      - name: Run tests
        working-directory: platform-services/organisation
        run: npm test

  validate-hrms:
    name: Validate platform-services/hrms
    runs-on: ubuntu-latest
    # Same shared Postgres schema as Identity/Data Vault/Organisation
    # (this package's tables — hr_lifecycle_cases/events/milestones/
    # hr_probation_reviews — are applied by the same migration runner,
    # 004_hrms-employee-lifecycle) — see docs/architecture/
    # hrms-employee-lifecycle.md "Module ownership and dependency
    # direction".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sve_identity
          POSTGRES_PASSWORD: sve_identity_ci_only
          POSTGRES_DB: sve_identity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sve_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sve_identity:sve_identity_ci_only@localhost:5432/sve_identity_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            platform-services/identity/package-lock.json
            platform-services/organisation/package-lock.json
            platform-services/workflow/package-lock.json
            platform-services/hrms/package-lock.json

      # HRMS imports platform-services/identity's Postgres repositories/
      # session/RBAC/audit implementations, platform-services/organisation's
      # own composition root/services (for Employee Master data and
      # authoritative assignment transitions), AND — since PR #9 —
      # platform-services/workflow's own composition root (for the
      # employment-change/offboarding approval integration; see
      # src/integrations/workflowIntegration.ts) by source path — same
      # documented cross-package-import boundary as Data Vault and
      # Organisation before it (see platform-services/hrms/README.md). All
      # four packages' own dependencies must be installed for HRMS's tests
      # to resolve.
      - name: Install platform-services/identity dependencies
        working-directory: platform-services/identity
        run: npm ci

      - name: Install platform-services/organisation dependencies (HRMS imports its Employee Master/assignment services)
        working-directory: platform-services/organisation
        run: npm ci

      - name: Install platform-services/workflow dependencies (HRMS imports its orchestration engine for approval routing)
        working-directory: platform-services/workflow
        run: npm ci

      - name: Install platform-services/hrms dependencies
        working-directory: platform-services/hrms
        run: npm ci

      - name: Type-check
        working-directory: platform-services/hrms
        run: npm run typecheck

      - name: Run migrations against the CI database
        working-directory: platform-services/hrms
        run: npm run migrate

      # Real unit + integration tests — lifecycle case state transitions,
      # onboarding milestones, probation extension/decision-once integrity,
      # employment-change/offboarding atomic completion against real
      # Organisation assignment transitions, RBAC/entity/classification
      # enforcement (including SK Lai & Partners' privileged tier),
      # manager/self-service boundaries, mass-assignment and
      # IDOR/existence-leak checks, and (PR #9) the full HRMS <-> Workflow
      # approval integration — submission, ROLE-routed approval/rejection,
      # rollback/idempotency/concurrency, and Identity's untouched-account
      # invariant during offboarding — against the real shared Postgres
      # schema.
      - name: Run tests
        working-directory: platform-services/hrms
        run: npm test

  validate-workflow:
    name: Validate platform-services/workflow
    runs-on: ubuntu-latest
    # Same shared Postgres schema as Identity/Data Vault/Organisation/HRMS
    # (this package's tables — workflow_definitions/versions/steps/
    # instances/tasks/decisions/events/system_action_executions — are
    # applied by the same migration runner, 005_workflow-approval-
    # foundation) — see docs/architecture/workflow-approval-foundation.md
    # "Module ownership and dependency direction".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sve_identity
          POSTGRES_PASSWORD: sve_identity_ci_only
          POSTGRES_DB: sve_identity_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sve_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sve_identity:sve_identity_ci_only@localhost:5432/sve_identity_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            platform-services/identity/package-lock.json
            platform-services/organisation/package-lock.json
            platform-services/workflow/package-lock.json

      # Workflow imports both platform-services/identity's Postgres
      # repositories/session/RBAC/audit implementations AND
      # platform-services/organisation's own composition root/services
      # (for MANAGER routing/escalation via resolveDirectManagerUserId) by
      # source path — same documented cross-package-import boundary as
      # Data Vault, Organisation, and HRMS before it. Workflow deliberately
      # does NOT depend on platform-services/hrms — see
      # platform-services/workflow/README.md.
      - name: Install platform-services/identity dependencies
        working-directory: platform-services/identity
        run: npm ci

      - name: Install platform-services/organisation dependencies (Workflow imports its manager-routing service)
        working-directory: platform-services/organisation
        run: npm ci

      - name: Install platform-services/workflow dependencies
        working-directory: platform-services/workflow
        run: npm ci

      - name: Type-check
        working-directory: platform-services/workflow
        run: npm run typecheck

      - name: Run migrations against the CI database
        working-directory: platform-services/workflow
        run: npm run migrate

      # Real unit + integration tests — definition versioning/publish
      # validation/immutability, concurrent version-numbering and
      # concurrent-decision safety against real Postgres, sequential
      # routing (USER/ROLE/MANAGER) via Organisation's manager-routing
      # contract, no-self-approval and no-eligible-approver safe failure,
      # registered-system-action-only execution with idempotency,
      # RBAC/entity/classification enforcement (including SK Lai &
      # Partners' privileged tier), escalation processing, mass-assignment
      # and IDOR/existence-leak checks — against the real shared Postgres
      # schema.
      - name: Run tests
        working-directory: platform-services/workflow
        run: npm test
